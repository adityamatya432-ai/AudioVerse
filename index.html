  <!DOCTYPE html>

  <body>

  <div class="container">

    <div class="songList">

        <div class="songItem">
          <img alt="1">
          <span class="songName">Saiyaara</span>

        <div class="songItem">
          <img alt="1">
          <span class="songName">Tum Ho Toh</span>
          <span class="songlistplay"></span><span class="timestamp">05:16<i id="2"   class="fas songItemPlay fa-2x fa-play-circle"></i></span></span>
        </div>
        
        <div class="songItem">
          <img alt="1">

    <div class="songBanner"></div>

  </div>

    <!-- input type="range" → Slider (Spotify progress bar). -->
    <!-- name="range" → Input name (mostly used in forms, not important here). -->
    <!-- id="MyProgressBar" → Unique ID  to access the slider using JavaScript. & for css also-->
    <!-- min="0" → Slider starts from 0% (song start). max="100" → Slider ends at 100% (song end). -->
    <div class="bottom">
      <input type="range" name="range" id="MyProgressBar" min="0" value="0" max="100">
      <span id="currentTime">00:00</span>
      <div class="icons">
        <!-- fontawesome icons -->
        <i class="fas fa-2x fa-fast-backward" id="prev"></i>
        <span id="masterPlay">
          <i class="fas fa-play" id="playIcon"></i>
          <i class="fas fa-pause" id="pauseIcon" style="display:none;"></i>
        </span>
        <i class="fas fa-2x fa-fast-forward" id="next"></i>

      </div>
      <div class="songinfo">
        <img src="dancing.gif" width="42px" alt=""  id="gif"> Closer
    
      </div>
    </div>
    <script src="script.js"></script>
  </body>
  </html>
